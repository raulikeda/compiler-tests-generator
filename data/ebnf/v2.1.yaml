PROGRAM = { STATEMENT } ;
BLOCK = "&LBRA", "&LF", { STATEMENT }, "&RBRA" ;
STATEMENT = (("&IF", "&ELP", BOOLEXPRESSION, "&ERP", BLOCK, ("&LF", "&ELSE", BLOCK) | ε) | ("&WHILE", "&ELP", BOOLEXPRESSION, "&ERP", BLOCK) | (IDENTIFIER, "&ASSIGN", BOOLEXPRESSION) | ("&PRINT", "&FLP", BOOLEXPRESSION, "&FRP") | BLOCK | ε), "&LF" ;
BOOLEXPRESSION = BOOLTERM, { "&OR", BOOLTERM } ;
BOOLTERM = RELEXPRESSION, { "&AND", RELEXPRESSION } ;
RELEXPRESSION = EXPRESSION, { ("&EQ" | "&GT" | "&LT"), EXPRESSION };
EXPRESSION = TERM, { ("+" | "-"), TERM } ;
TERM = FACTOR, { ("*" | "/"), FACTOR } ;
FACTOR = NUMBER | IDENTIFIER | ("+" | "-"), FACTOR | "(", BOOLEXPRESSION, ")" | "&SCAN", "&FLP", "&FRP" ;
NUMBER = DIGIT, {DIGIT} ;
IDENTIFIER = LETTER, {LETTER | DIGIT | "_"} ;
DIGIT = "0" | "1" | ... | "9" ;
LETTER = "a" | "b" | ... | "z" | "A" | "B" | ... | "Z" ;