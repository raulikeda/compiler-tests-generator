PROGRAM = { STATEMENT } ;
STATEMENT = ((IF, "(", BOOLEXPRESSION, ")", STATEMENT, ("ELSE", STATEMENT) | ε) | (WHILE, "(", BOOLEXPRESSION, ")", STATEMENT) | (IDENTIFIER, "=", BOOLEXPRESSION) | (PRINT, "(", BOOLEXPRESSION, ")") | ε), EOL ;
BOOLEXPRESSION = BOOLTERM, { "||", BOOLTERM } ;
BOOLTERM = RELEXPRESSION, { "&&", RELEXPRESSION } ;
RELEXPRESSION = EXPRESSION, ("==" | "<" | ">"), EXPRESSION ;
EXPRESSION = TERM, { ("+" | "-"), TERM } ;
TERM = FACTOR, { ("*" | "/"), FACTOR } ;
FACTOR = ("+" | "-"), FACTOR | "(", BOOLEXPRESSION, ")" | NUMBER | READ, "(", ")" ;
NUMBER = DIGIT, {DIGIT} ;
IDENTIFIER = LETTER, {LETTER | DIGIT | "_"} ;
DIGIT = "0" | "1" | ... | "9" ;
LETTER = "a" | "b" | ... | "z" | "A" | "B" | ... | "Z" ;

PROGRAM = { STATEMENT } ;
BLOCK = "&LBRA" , { STATEMENT } , "&RBRA" ;
IFBLOCK = "LIBRA", { STATEMENT } , "&RIBRA" ;
STATEMENT = (IDENTIFIER, "&ASSIGN", BOOLEXPRESSION | "&PRINT", "&FLP", BOOLEXPRESSION, "&FRP" | ε), "&EOL" | (IF, "&ELP", BOOLEXPRESSION, "&ERP", STATEMENT, ("ELSE", STATEMENT) | ε) | (WHILE, "&ELP", BOOLEXPRESSION, "&ERP", STATEMENT) | BLOCK ;
BOOLEXPRESSION = BOOLTERM, { "&OR", BOOLTERM } ;
BOOLTERM = RELEXPRESSION, { "&AND", RELEXPRESSION } ;
RELEXPRESSION = EXPRESSION, ("&EQ" | "&LT" | "&GT"), EXPRESSION ;
EXPRESSION = TERM, { ("+" | "-"), TERM } ;
TERM = FACTOR, { ("*" | "/"), FACTOR } ;
FACTOR = NUMBER | IDENTIFIER, { ("+" | "-"), FACTOR } | "&ELP", BOOLEXPRESSION, "&ERP" ;
NUMBER = DIGIT, {DIGIT} ;
IDENTIFIER = LETTER, {LETTER | DIGIT | "_"} ;
DIGIT = "0" | "1" | ... | "9" ;
LETTER = "a" | "b" | ... | "z" | "A" | "B" | ... | "Z" ;